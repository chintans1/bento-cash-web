name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      LUNCH_MONEY_CLIENT_ID: ci-lunch-money-client-id
      LUNCH_MONEY_CLIENT_SECRET: ci-lunch-money-client-secret
      LUNCH_MONEY_OAUTH_ISSUER: https://api-alpha.lunchmoney.dev
      BENTO_CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build Workers
        run: pnpm build

      - name: Check database Worker deployment
        run: pnpm exec cf deploy --prebuilt --mode production --worker bento-cash-web-database --dry-run

      - name: Check app Worker deployment
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      - name: Build test Workers
        run: pnpm exec cf build --mode staging

      - name: Check test database Worker deployment
        run: pnpm exec cf deploy --prebuilt --mode staging --worker bento-cash-web-oauth-test-database --dry-run

      - name: Check test app Worker deployment
        run: pnpm exec cf deploy --prebuilt --mode staging --dry-run

      - name: Verify Durable Object migrations locally
        run: pnpm db:verify-migrations
